<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Agent Chat</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --container-bg: rgba(30, 30, 46, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #cdd6f4;
            --text-muted: #a6adc8;
            --accent-primary: #cba6f7;
            --accent-secondary: #f38ba8;
            --accent-gradient: linear-gradient(135deg, #89b4fa 0%, #cba6f7 100%);
            --user-bubble-bg: linear-gradient(135deg, #b4befe 0%, #74c7ec 100%);
            --agent-bubble-bg: rgba(49, 50, 68, 0.5);
            --console-bg: #11111b;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Header Layout */
        .header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            width: 22px;
            height: 22px;
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f38ba8;
        }

        .status-dot.authenticated {
            background-color: #a6e3a1;
            box-shadow: 0 0 6px #a6e3a1;
        }

        .btn-auth {
            background: rgba(203, 166, 247, 0.15);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-auth:hover {
            background: var(--accent-primary);
            color: var(--bg-color);
        }

        .model-select-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        select {
            flex: 1;
            background-color: #313244;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            outline: none;
            cursor: pointer;
        }

        /* Message Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble-bg);
            color: #11111b;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 10px rgba(116, 199, 236, 0.2);
        }

        .message.agent {
            align-self: flex-start;
            background-color: var(--agent-bubble-bg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 2px;
        }

        .message-sender {
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        .message-content {
            white-space: pre-wrap;
        }

        /* Pending Changes CSS */
        .changes-list {
            margin-top: 8px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .change-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .change-entry:last-child {
            border-bottom: none;
        }

        .change-file {
            font-family: var(--font-mono);
            font-size: 11px;
            word-break: break-all;
            margin-right: 12px;
            color: #cdd6f4;
        }

        .change-badge {
            font-size: 8px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .badge-new {
            background-color: rgba(137, 180, 250, 0.15);
            color: #89b4fa;
            border: 1px solid rgba(137, 180, 250, 0.3);
        }

        .badge-modify {
            background-color: rgba(250, 179, 135, 0.15);
            color: #fab387;
            border: 1px solid rgba(250, 179, 135, 0.3);
        }

        .changes-actions-container {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-action {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            text-align: center;
        }

        .btn-action.accept {
            background: linear-gradient(135deg, #a6e3a1 0%, #94e2d5 100%);
            border: none;
            color: #11111b;
        }

        .btn-action.accept:hover {
            box-shadow: 0 0 8px rgba(166, 227, 161, 0.4);
            transform: translateY(-1px);
        }

        .btn-action.reject {
            background: transparent;
            border: 1px solid #f38ba8;
            color: #f38ba8;
        }

        .btn-action.reject:hover {
            background: rgba(243, 139, 168, 0.1);
            transform: translateY(-1px);
        }

        .status-msg {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 0;
            display: inline-block;
        }

        .status-msg.success {
            color: #a6e3a1;
        }

        .status-msg.reverted {
            color: #f38ba8;
        }

        .status-msg.processing {
            color: #f9e2af;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Summary Markdown styling */
        .summary-markdown h1, .summary-markdown h2, .summary-markdown h3 {
            margin-top: 8px;
            margin-bottom: 4px;
            color: #cdd6f4;
            font-weight: 600;
        }
        .summary-markdown h1 { font-size: 14px; }
        .summary-markdown h2 { font-size: 13px; }
        .summary-markdown h3 { font-size: 12px; }
        .summary-markdown ul {
            margin: 4px 0;
            padding-left: 16px;
        }
        .summary-markdown li {
            margin-bottom: 2px;
        }
        .summary-markdown code {
            font-family: var(--font-mono);
            font-size: 10px;
            background: rgba(0,0,0,0.2);
            padding: 1px 3px;
            border-radius: 3px;
            color: #f9e2af;
        }
        .summary-markdown pre {
            background: rgba(0,0,0,0.3);
            padding: 6px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 6px 0;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .summary-markdown pre code {
            background: none;
            padding: 0;
            color: #cdd6f4;
        }

        /* Live Terminal Console Overlay */
        .console-container {
            display: none;
            background-color: var(--console-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 10px;
            color: #a6e3a1;
        }

        .console-title {
            font-size: 9px;
            font-weight: bold;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .console-line {
            line-height: 1.4;
            white-space: pre-wrap;
        }

        /* Input Bar */
        .input-container {
            display: flex;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            margin-top: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            background-color: #313244;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            resize: none;
            max-height: 80px;
            outline: none;
            box-sizing: border-box;
            line-height: 1.4;
        }

        textarea:focus {
            border-color: var(--accent-primary);
        }

        .btn-send {
            background: var(--accent-gradient);
            border: none;
            color: #11111b;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 34px;
            box-sizing: border-box;
            transition: opacity 0.2s ease;
        }

        .btn-send:hover {
            opacity: 0.9;
        }

        .btn-send:disabled {
            background: #45475a;
            color: #7f849c;
            cursor: not-allowed;
        }

        /* Loader Animation */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="header">
        <div class="header-row">
            <div class="title-area">
                <svg class="logo" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#cba6f7" stroke-width="6" />
                    <path d="M50 20 L68 58 L50 50 L32 58 Z" fill="#cba6f7" />
                </svg>
                <div class="title">Coding Agent Ai</div>
            </div>
            <div class="auth-status">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">Checking auth...</span>
                <button id="btnAuth" class="btn-auth" onclick="signIn()">Sign In</button>
            </div>
        </div>
        <div class="model-select-wrapper">
            <select id="modelSelect" onchange="modelChanged()">
                <option value="qwen3-coder:480b-cloud">qwen3-coder:480b-cloud</option>
                <option value="nemotron-3-super">nemotron-3-super</option>
                <option value="gemma4:31b">gemma4:31b</option>
                <option value="gpt-oss:20b">gpt-oss:20b</option>
            </select>
        </div>
    </div>

    <!-- Messages Chat History -->
    <div class="chat-container" id="chatContainer">
        <div class="message agent">
            <div class="message-sender">Coding Agent AI</div>
            <div class="message-content">Hello! I am your Coding Agent AI Agent. Enter a prompt below, and I will run fully autonomously in your workspace.</div>
        </div>
    </div>

    <!-- Live Terminal Console -->
    <div class="console-container" id="consoleContainer">
        <div class="console-title">
            <span>LIVE AGENT LOGS</span>
            <span onclick="clearConsole()" style="cursor:pointer; text-decoration: underline;">Clear</span>
        </div>
        <div id="consoleLog"></div>
    </div>

    <!-- Input Box -->
    <div class="input-container">
        <textarea id="promptInput" placeholder="Ask agent to write code or analyze..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
        <button id="btnSend" class="btn-send" onclick="sendPrompt()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        const chatContainer = document.getElementById('chatContainer');
        const promptInput = document.getElementById('promptInput');
        const btnSend = document.getElementById('btnSend');
        const modelSelect = document.getElementById('modelSelect');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const btnAuth = document.getElementById('btnAuth');
        const consoleContainer = document.getElementById('consoleContainer');
        const consoleLog = document.getElementById('consoleLog');

        // Request current settings once loaded
        vscode.postMessage({ type: 'getSettings' });

        // Listen for messages from extension.js
        window.addEventListener('message', event => {
            const msg = event.data;
            switch (msg.type) {
                case 'settings':
                    updateSettingsUI(msg.data);
                    break;
                case 'log':
                    appendConsoleLog(msg.data);
                    break;
                case 'status':
                    updateAgentStatus(msg.data);
                    break;
                case 'error':
                    appendErrorMessage(msg.data);
                    break;
                case 'clearChat':
                    clearChatUI();
                    break;
                case 'runCompleted':
                    displayRunCompleted(msg.data);
                    break;
                case 'revertCompleted':
                    displayRevertCompleted();
                    break;
            }
        });

        function updateSettingsUI(settings) {
            modelSelect.value = settings.model;
            if (settings.hasApiKey) {
                statusDot.className = 'status-dot authenticated';
                statusText.innerText = 'Authenticated';
                btnAuth.style.display = 'none';
            } else {
                statusDot.className = 'status-dot';
                statusText.innerText = 'Unsigned In';
                btnAuth.style.display = 'block';
            }
        }

        function signIn() {
            // Trigger command to enter API key in VS Code input box,
            // and open browser window to sign in on ollama.com
            vscode.postMessage({ type: 'openSignIn' });
            vscode.postMessage({ type: 'getSettings' }); // Request setting update after
        }

        function modelChanged() {
            vscode.postMessage({ type: 'selectModel', data: modelSelect.value });
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendPrompt();
            }
        }

        function sendPrompt() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            // Append user message
            appendMessage('user', 'You', prompt);
            promptInput.value = '';
            
            // Disable inputs
            promptInput.disabled = true;
            btnSend.disabled = true;

            // Clear logs and display console
            consoleLog.innerHTML = '';
            consoleContainer.style.display = 'block';

            // Send prompt to extension backend
            vscode.postMessage({ type: 'sendPrompt', data: prompt });
        }

        function appendMessage(senderClass, senderName, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${senderClass}`;
            
            const senderDiv = document.createElement('div');
            senderDiv.className = 'message-sender';
            senderDiv.innerText = senderName;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerText = content;

            msgDiv.appendChild(senderDiv);
            msgDiv.appendChild(contentDiv);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendConsoleLog(data) {
            const line = document.createElement('div');
            line.className = 'console-line';
            line.innerText = data;
            consoleLog.appendChild(line);
            consoleContainer.scrollTop = consoleContainer.scrollHeight;
        }

        function updateAgentStatus(statusText) {
            // Check if run has ended
            const isDone = statusText.includes('Finished successfully!') || 
                           statusText.includes('exited with code') || 
                           statusText.includes('Failed');

            if (isDone) {
                // Re-enable inputs
                promptInput.disabled = false;
                btnSend.disabled = false;
                promptInput.focus();

                appendMessage('agent', 'Coding Agent AI', `Run completed: ${statusText}`);
            } else {
                // Showing log status
                const indicator = document.getElementById('typingIndicator');
                if (!indicator) {
                    const typingDiv = document.createElement('div');
                    typingDiv.id = 'typingIndicator';
                    typingDiv.className = 'message agent';
                    typingDiv.innerHTML = `
                        <div class="message-sender">Agent Status</div>
                        <div class="typing-indicator">
                            <span id="typingStatusText">${statusText}</span>
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                    `;
                    chatContainer.appendChild(typingDiv);
                } else {
                    document.getElementById('typingStatusText').innerText = statusText;
                }
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function appendErrorMessage(errorMsg) {
            // Clean loader indicator if exists
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();

            promptInput.disabled = false;
            btnSend.disabled = false;

            appendMessage('agent', 'Coding Agent AI', `ERROR: ${errorMsg}`);
        }

        function clearChatUI() {
            chatContainer.innerHTML = '';
            consoleContainer.style.display = 'none';
            consoleLog.innerHTML = '';
            appendMessage('agent', 'Coding Agent AI', 'Chat history cleared. Send a new prompt below.');
        }

        function clearConsole() {
            consoleLog.innerHTML = '';
        }

        function displayRunCompleted(data) {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();

            promptInput.disabled = false;
            btnSend.disabled = false;
            promptInput.focus();

            appendWalkthroughMessage(data.summary);

            if (data.changes && data.changes.length > 0) {
                appendChangesPanel(data.changes, data.manifestPath);
            } else {
                appendMessage('agent', 'Coding Agent AI', 'Execution finished. No files were modified.');
            }
        }

        function appendWalkthroughMessage(summaryText) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message agent`;
            
            const senderDiv = document.createElement('div');
            senderDiv.className = 'message-sender';
            senderDiv.innerText = 'Coding Agent Walkthrough Summary';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content summary-markdown';
            contentDiv.innerHTML = formatMarkdown(summaryText);

            msgDiv.appendChild(senderDiv);
            msgDiv.appendChild(contentDiv);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function formatMarkdown(text) {
            if (!text) return '';
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/`(.*?)`/gim, '<code>$1</code>')
                .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
                .replace(/^\s*-\s*(.*$)/gim, '<li>$1</li>')
                .replace(/^\s*\*\s*(.*$)/gim, '<li>$1</li>')
                .replace(/\n/g, '<br>');
            
            html = html.replace(/(<li>.*<\/li>)/gim, '<ul>$1</ul>');
            return html;
        }

        function appendChangesPanel(changes, manifestPath) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message agent';
            msgDiv.style.border = '1px solid rgba(137, 180, 250, 0.2)';
            
            const senderDiv = document.createElement('div');
            senderDiv.className = 'message-sender';
            senderDiv.innerText = 'Pending Workspace Changes';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            let filesHtml = '<div class="changes-list">';
            changes.forEach(c => {
                const badgeClass = c.type === 'new' ? 'badge-new' : 'badge-modify';
                const badgeText = c.type === 'new' ? 'NEW' : 'MODIFIED';
                filesHtml += `
                    <div class="change-entry">
                        <span class="change-file">${c.file}</span>
                        <span class="change-badge ${badgeClass}">${badgeText}</span>
                    </div>
                `;
            });
            filesHtml += '</div>';

            const safePath = manifestPath.replace(/\\/g, '/');

            const actionButtonsHtml = `
                <div class="changes-actions-container" id="actions-${safePath.replace(/[^a-zA-Z0-9]/g, '')}">
                    <button class="btn-action accept" onclick="acceptChanges('${safePath}')">Accept Changes</button>
                    <button class="btn-action reject" onclick="rejectChanges('${safePath}')">Reject Changes</button>
                </div>
            `;

            contentDiv.innerHTML = filesHtml + actionButtonsHtml;
            msgDiv.appendChild(senderDiv);
            msgDiv.appendChild(contentDiv);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function acceptChanges(manifestPath) {
            vscode.postMessage({ type: 'acceptChanges', manifestPath: manifestPath });
            const id = 'actions-' + manifestPath.replace(/[^a-zA-Z0-9]/g, '');
            const el = document.getElementById(id);
            if (el) {
                el.innerHTML = '<span class="status-msg success">✓ Changes Accepted</span>';
            }
        }

        function rejectChanges(manifestPath) {
            vscode.postMessage({ type: 'rejectChanges', manifestPath: manifestPath });
            const id = 'actions-' + manifestPath.replace(/[^a-zA-Z0-9]/g, '');
            const el = document.getElementById(id);
            if (el) {
                el.innerHTML = '<span class="status-msg processing">Reverting changes...</span>';
            }
        }

        function displayRevertCompleted() {
            const elements = document.querySelectorAll('.status-msg.processing');
            elements.forEach(el => {
                el.className = 'status-msg reverted';
                el.innerText = '✗ Changes Reverted';
            });
        }
    </script>
</body>
</html>
